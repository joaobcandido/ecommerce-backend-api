name: Auto Create Pull Request

on:
  push:
    branches:
      - 'feature/**'
      - 'feature-*'

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Create Pull Request to develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Current branch: $BRANCH_NAME"
          
          # Verificar se branch develop existe
          if ! git rev-parse --verify origin/develop &>/dev/null; then
            echo "❌ Erro: Branch 'develop' não existe!"
            exit 1
          fi
          
          # Verificar se já existe um PR aberto da branch atual para a develop
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base develop --json number --jq '.[0].number' 2>/dev/null || echo "")
          
          if [ -z "$EXISTING_PR" ]; then
            echo "✅ Nenhum Pull Request existente encontrado. Criando um novo..."
            gh pr create \
              --head "$BRANCH_NAME" \
              --base develop \
              --title "Feature: $BRANCH_NAME" \
              --body "PR automático criado a partir do push na branch \`$BRANCH_NAME\` direcionado para \`develop\`." \
              --draft=false
            echo "✅ PR criado com sucesso!"
          else
            echo "ℹ️ Pull Request já existe para essa branch para a develop: #$EXISTING_PR"
          fi
