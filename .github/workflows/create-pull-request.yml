name: Auto Create Pull Request

on:
  push:
    branches:
      - 'feature/**'
      - 'feature-*'

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pull Request to develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Current branch: $BRANCH_NAME"
          
          # Verificar se já existe um PR aberto da branch atual para a develop
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base develop --json number --jq '.[0].number')
          
          if [ -z "$EXISTING_PR" ]; then
            echo "Nenhum Pull Request existente encontrado. Criando um novo..."
            gh pr create \
              --head "$BRANCH_NAME" \
              --base develop \
              --title "Feature: $BRANCH_NAME" \
              --body "PR automático criado a partir do push na branch \`$BRANCH_NAME\` direcionado para \`develop\`." || echo "Aviso: Não foi possível criar o PR. Verifique se existem commits de diferença entre a branch atual e a develop."
          else
            echo "Pull Request já existe para essa branch para a develop: #$EXISTING_PR"
          fi
